# Default build: logging on the USB serial console, for bring-up.
# For the battery build add overlay-battery.conf, see README.

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y
# Scan all channels, the coordinator picks its own (Nordic defaults to 16 only)
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_MULTI=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# The AXA needs 8N2, set with uart_configure(). Nordic SoCs default this off,
# uart_configure() then fails with -ENOTSUP and the AXA thread never starts.
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_GPIO=y
# Reset cause for the boot message
CONFIG_HWINFO=y

# Suspend the AXA UART between transactions, its receiver keeps the
# high frequency clock running otherwise
CONFIG_PM_DEVICE=y
CONFIG_RAM_POWER_DOWN_LIBRARY=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# USB serial console with logging
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_ESPAXA_LOG_LEVEL_DBG=y
# Detect a terminal opening the console (DTR), to repeat the boot message
CONFIG_UART_LINE_CTRL=y

# Room for the bus traces of a whole exchange with retries
CONFIG_LOG_BUFFER_SIZE=16384
